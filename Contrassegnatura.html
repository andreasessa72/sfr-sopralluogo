<script>
/* ---------- Coordinate UTM WGS84 ---------- */
const UTM=(()=>{const a=6378137,f=1/298.257223563,k0=0.9996,e2=f*(2-f),ep2=e2/(1-e2),e4=e2*e2,e6=e4*e2;

function toUTM(lat,lon,zone=32){const l0=l0z(zone),p=rad(lat),L=rad(lon),s=Math.sin(p),c=Math.cos(p),t=Math.tan(p);
 const N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=c*(L-l0);
 const M=a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));
 return{E:k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000,
  N:k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720))};}
function fromUTM(E,Nn,zone=32){const l0=l0z(zone),mu=(Nn/k0)/(a*(1-e2/4-3*e4/64-5*e6/256)),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
 const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
 const s=Math.sin(p1),c=Math.cos(p1),t=Math.tan(p1),N1=a/Math.sqrt(1-e2*s*s),T1=t*t,C1=ep2*c*c,R1=a*(1-e2)/Math.pow(1-e2*s*s,1.5),D=(E-500000)/(N1*k0);
 return{lat:deg(p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720)),
  lon:deg(l0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/c)};}
/* Legge "45.0712, 7.4651" oppure 45°04'16.3"N 7°27'54.4"E */
function parseLatLon(str){if(!str)return null;const s=str.trim().replace(/,(?=\d)/g,m=>m);
 const dms=/(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['′’]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:"|″|”|'')\s*)?([NSEWO])?/gi;
 const parts=[...s.matchAll(dms)];
 if(parts.length>=2){const v=parts.slice(0,2).map(m=>{let x=+m[1].replace(',','.')+(m[2]?+m[2].replace(',','.')/60:0)+(m[3]?+m[3].replace(',','.')/3600:0);
   const h=(m[4]||'').toUpperCase();if(h==='S'||h==='W'||h==='O')x=-x;return{x,h};});
   let lat=v[0].x,lon=v[1].x;if(v[0].h==='E'||v[0].h==='W'||v[0].h==='O'){[lat,lon]=[lon,lat];}return check(lat,lon);}
 const nums=s.match(/-?\d+(?:\.\d+)?/g);if(nums&&nums.length>=2)return check(+nums[0],+nums[1]);return null;
 function check(lat,lon){return(isFinite(lat)&&isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180)?{lat,lon}:null;}}
return{toUTM,fromUTM,parseLatLon};})();
const inPiemonte=(E,N)=>E>300000&&E<540000&&N>4840000&&N<5160000;

/* ---------- Dati di riferimento ---------- */
const SPECIE=["Castagno","Robinia","Rovere","Farnia","Roverella","Cerro","Carpino bianco","Carpino nero","Frassino maggiore","Acero campestre","Acero di monte","Ciliegio selvatico","Tiglio","Betulla","Pino silvestre","Faggio","Ontano nero","Pioppo tremolo","Orniello","Olmo campestre","Sorbo","Quercia rossa","Ciliegio tardivo","Ailanto","Acero americano","Altra specie"];
const SPORADICHE=new Set(["Acero campestre","Acero di monte","Frassino maggiore","Ciliegio selvatico","Tiglio","Olmo campestre","Sorbo"]);
const ESOTICHE=new Set(["Quercia rossa","Ciliegio tardivo","Ailanto","Acero americano"]);
const STATI={taglio:"Taglio",resta:"Non segnata",allievo:"Allievo",bio:"Biodiversità"};
const PUNTI=["Centro area","Vertice","Albero biodiversità","Albero morto (invecchiamento)","Imposto","Accesso","Altro"];
const TUTELE={"":"Nessuna","area_protetta":"Area protetta (l.r. 19/2009)","natura2000":"Sito Natura 2000"};

/* ---------- Stato ---------- */
const LS="contrassegnatura-v2",LS_OLD="contrassegnatura-v1";
const oggi=()=>new Date().toISOString().slice(0,10);
const nuovoCantiere=(o={})=>Object.assign({nome:"",comune:"",localita:"",data:oggi(),supHa:"",rilevatore:"",tecnico:"",vernice:"Arancio",criterio:"Diradamento dal basso",tutela:"",nomeTutela:"",fForma:0.5,densita:9,creato:new Date().toISOString()},o);
let S={cantieri:{},aree:{},attivo:null,ultimoBackup:null};
let view={name:"aree",id:null,tab:"piante",nuovaSp:"Castagno",nuovoStato:"taglio",nuovoD:20,confirm:null,modoD:"esatto",nuovaCep:""};
const num=v=>parseFloat(String(v??"").replace(",","."));
let db=null,dl=null,dirty=new Set(),saving=new Set(),online=false,persistito=null;
function migraVecchio(o){/* formato v1: un solo cantiere in "progetto" */
 const cid="c"+Date.now().toString(36);S.cantieri[cid]=nuovoCantiere(Object.assign({nome:(o.progetto&&o.progetto.comune)||"Primo cantiere"},o.progetto||{}));
 for(const [id,a] of Object.entries(o.aree||{})){S.aree[id]=Object.assign({},a,{cantiere:cid});}S.attivo=cid;return cid;}
try{const raw=localStorage.getItem(LS);
 if(raw){const o=JSON.parse(raw);S.cantieri=o.cantieri||{};S.aree=o.aree||{};S.attivo=o.attivo||null;S.ultimoBackup=o.ultimoBackup||null;(o.dirty||[]).forEach(x=>dirty.add(x));}
 const old=localStorage.getItem(LS_OLD);
 if(old&&!localStorage.getItem(LS+"-migrato")){const o=JSON.parse(old);
  if(o&&o.aree&&Object.keys(o.aree).length){const prima=new Set(Object.keys(S.aree));const cid=migraVecchio(o);dirty.add("c:"+cid);Object.keys(S.aree).filter(id=>!prima.has(id)).forEach(id=>dirty.add(id));}
  localStorage.setItem(LS+"-migrato","1");}}catch(e){}
function ensureAttivo(){if(S.cantieri[S.attivo])return;const ids=Object.keys(S.cantieri).sort((a,b)=>(S.cantieri[b].data||"").localeCompare(S.cantieri[a].data||""));
 if(ids.length){S.attivo=ids[0];return;}const cid="c"+uidSafe();S.cantieri[cid]=nuovoCantiere({nome:"Rosta – Sant'Antonio di Ranverso",comune:"Rosta (TO)",localita:"Sant'Antonio di Ranverso",supHa:2.1,criterio:"Diradamento del robinieto, rilascio autoctone",tutela:"area_protetta",nomeTutela:"ZNS Dora Riparia"});S.attivo=cid;dirty.add("c:"+cid);}
function uidSafe(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
const P=()=>{ensureAttivo();return S.cantieri[S.attivo];};
const areeDi=cid=>Object.keys(S.aree).filter(id=>S.aree[id].cantiere===cid).sort((a,b)=>(S.aree[a].creata||"").localeCompare(S.aree[b].creata||""));
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cantieri:S.cantieri,aree:S.aree,attivo:S.attivo,ultimoBackup:S.ultimoBackup,dirty:[...dirty]}));}catch(e){}}

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(x,d=1)=>isFinite(x)?x.toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}):"–";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200);}
function setSync(){const el=$("#sync");if(!db){el.textContent=navigator.onLine===false?"Offline · dati sul telefono":"Dati sul telefono";return;}
 el.textContent=(dirty.size||saving.size)?(online?"Salvataggio…":"In attesa di rete"):(online?"Sincronizzato":"Connessione…");}

/* ---------- Calcoli ---------- */
function supArea(a){if(a.forma==="cerchio")return Math.PI*(+a.raggio||0)**2;return +a.superficie||0;}
/* Classe diametrica di 5 cm indicata dal valore centrale: 10 = 7,5–12,4 cm */
const CL=d=>5*Math.round((+d||0)/5);
const gOf=d=>Math.PI*((+d||0)/200)**2;
const SOGLIA_CEDUO=7.5,SOGLIA_FUSTAIA=17.5;
const isCeduo=s=>/cedu|robin|castagn/i.test(s||"");
/* Curva ipsometrica h = a + b·ln(d), minimi quadrati sulle altezze misurate */
function curvaH(PL){const pts=PL.filter(p=>+p.h>0&&+p.d>0).map(p=>[Math.log(+p.d),+p.h]);
 if(pts.length<3)return null;const n=pts.length,mx=pts.reduce((s,x)=>s+x[0],0)/n,my=pts.reduce((s,x)=>s+x[1],0)/n;
 let sxx=0,sxy=0,syy=0;for(const [x,y] of pts){sxx+=(x-mx)**2;sxy+=(x-mx)*(y-my);syy+=(y-my)**2;}
 if(sxx<1e-4)return{n,ko:"Le altezze misurate sono tutte sulla stessa classe: misurane su diametri diversi."};
 const b=sxy/sxx,a=my-b*mx,r2=syy>0?sxy*sxy/(sxx*syy):0;
 if(b<=0)return{n,ko:"Con le altezze misurate l'altezza non cresce con il diametro: controlla i dati o aggiungi misure."};
 return{a,b,r2,n};}
function tipoDir(pre,post,nt){if(!nt||!isFinite(pre)||!isFinite(post))return null;const r=post/pre,t=`dg da ${fmt(pre)} a ${fmt(post)} cm`;
 if(r>1.02)return{k:"basso",t:`Diradamento dal basso: ${t}. Si tolgono soprattutto piante piccole e sottoposte.`};
 if(r<0.98)return{k:"alto",bad:1,t:`Diradamento dall'alto: ${t}. Si stanno togliendo le piante più grosse: verifica che non sia un taglio delle migliori.`};
 return{k:"misto",t:`Diradamento misto: ${t}, quasi invariato. Il prelievo interessa tutte le classi.`};}
function struttura(cl,N){const ks=Object.keys(cl).map(Number).sort((a,b)=>a-b);
 if(N<15||ks.length<3)return{k:null,t:"Servono almeno 15 piante su 3 classi per leggere la struttura."};
 const c=[];for(let x=ks[0];x<=ks[ks.length-1];x+=5){const o=cl[x];c.push(o?(o.taglio||0)+(o.resta||0)+(o.allievo||0)+(o.bio||0):0);}
 const s=c.map((v,i)=>(2*v+(c[i-1]??v)+(c[i+1]??v))/4),mx=Math.max(...s);const pk=[];
 s.forEach((v,i)=>{if(v>=mx*0.25&&(i===0||v>=s[i-1])&&(i===s.length-1||v>s[i+1]))pk.push(i);});
 for(let j=1;j<pk.length;j++){const v=Math.min(...s.slice(pk[j-1],pk[j]+1));if(v<0.7*Math.min(s[pk[j-1]],s[pk[j]]))return{k:"bimodale",t:"Distribuzione bimodale: due generazioni o due strati, per esempio ceduo con matricine o ceduo sotto fustaia."};}
 if(s.indexOf(mx)===0&&s[s.length-1]<mx*0.5)return{k:"J",t:"Distribuzione a J rovesciata: molte piante piccole e poche grandi. Popolamento disetaneo, oppure ceduo giovane e affollato."};
 return{k:"campana",t:"Distribuzione a campana: popolamento coetaneo o monoplano, tipica del ceduo e della fustaia coetanea."};}
function calc(a){const sup=supArea(a),k=sup>0?10000/sup:NaN,PL=a.piante||[];
 const cant=S.cantieri[a.cantiere]||P(),f=num(cant.fForma)||0.5;
 const hs=PL.filter(p=>+p.h>0).map(p=>+p.h);
 const Hc=num(a.hMedia)>0?num(a.hMedia):(hs.length?hs.reduce((x,y)=>x+y,0)/hs.length:NaN);
 const cur=curvaH(PL),ok=cur&&!cur.ko;
 const hD=d=>ok?Math.max(1.3,cur.a+cur.b*Math.log(d)):Hc;
 const hOf=p=>+p.h>0?+p.h:hD(+p.d);
 let N=0,G=0,Nt=0,Gt=0,Nr=0,Nb=0,V=0,Vt=0,sd=0,sdt=0,nCep=0;const sp={},cl={},snell=[],fuori=[],cep=new Set();
 PL.forEach((p,i)=>{const d=+p.d,gi=gOf(d),hi=hOf(p),vi=gi*hi*f,t=p.stato==="taglio";
  N++;G+=gi;sd+=d;if(isFinite(vi))V+=vi;
  if(t){Nt++;Gt+=gi;sdt+=d;if(isFinite(vi))Vt+=vi;}
  if(p.stato==="allievo")Nr++;if(p.stato==="bio")Nb++;
  const s=sp[p.specie]||(sp[p.specie]={n:0,g:0,nt:0,gt:0});s.n++;s.g+=gi;if(t){s.nt++;s.gt+=gi;}
  const c=CL(d),o=cl[c]||(cl[c]={taglio:0,resta:0,allievo:0,bio:0,g:0,gt:0,v:0,vt:0});
  o[p.stato]=(o[p.stato]||0)+1;o.g+=gi;if(isFinite(vi))o.v+=vi;if(t){o.gt+=gi;if(isFinite(vi))o.vt+=vi;}
  if(!t&&isFinite(hi)&&d>0)snell.push({i:i+1,stato:p.stato,specie:p.specie,d,h:hi,hd:hi/(d/100),mis:+p.h>0});
  if(p.cep!=null&&String(p.cep).trim()!==""){cep.add(String(p.cep).trim());nCep++;}
  if(a.forma==="cerchio"&&+p.dist>0&&+p.dist>num(a.raggio))fuori.push(i+1);});
 const dg=(g,n)=>n?Math.sqrt(4*g/(Math.PI*n))*100:NaN;
 const nDom=isFinite(k)?Math.max(1,Math.round(100/k)):0;
 const dom=PL.slice().sort((x,y)=>(+y.d)-(+x.d)).slice(0,nDom),hv=dom.map(hOf).filter(isFinite);
 const hDom=dom.length&&hv.length===dom.length?hv.reduce((s,x)=>s+x,0)/hv.length:NaN;
 const dgPre=dg(G,N),dgPost=dg(G-Gt,N-Nt);
 return{sup,k,N,G,Nt,Gt,Nr,Nb,H:Hc,cur,f,hOf,hD,sp,cl,snell,fuori,
  Nha:N*k,Gha:G*k,Ntha:Nt*k,Gtha:Gt*k,Gpost:(G-Gt)*k,pctN:N?Nt/N*100:0,pctG:G?Gt/G*100:0,
  Vha:V>0?V*k:NaN,Vtha:V>0?Vt*k:NaN,pctV:V>0?Vt/V*100:NaN,
  dgPre,dgT:dg(Gt,Nt),dgPost,dmPre:N?sd/N:NaN,dmT:Nt?sdt/Nt:NaN,dmPost:N-Nt?(sd-sdt)/(N-Nt):NaN,
  hDom,hDomMis:dom.length>0&&dom.every(p=>+p.h>0),nDom,nCep:cep.size,polCep:cep.size?nCep/cep.size:NaN,Cepha:cep.size*k,
  tipo:tipoDir(dgPre,dgPost,Nt),strut:struttura(cl,N)};}
function avvisi(a,c){const out=[];const cat=(a.categoria||"").toLowerCase();
 const minCop=(cat.includes("robin")||cat.includes("castagn"))?50:50;
 if(+a.copDopo>0&&+a.copDopo<minCop)out.push({bad:1,t:`Copertura a fine intervento ${a.copDopo}%: deve restare almeno al 50% (art. 22)${minCop>50?"":""}.`});
 if((cat.includes("robin")||cat.includes("castagn"))&&+a.copDopo===50)out.push({bad:1,t:"Nei robinieti e castagneti la copertura a fine diradamento deve essere superiore al 50% (art. 55, c. 5)."});
 for(const [s,v] of Object.entries(c.sp)){if(SPORADICHE.has(s)&&v.nt>0&&c.k&&v.n*c.k<20)out.push({bad:1,t:`${s} è sporadica con meno di 20 piante/ha: va rilasciata (art. 42). Ci sono ${v.nt} piante segnate al taglio.`});
  const cant=S.cantieri[a.cantiere]||{};
  if(cant.tutela&&!/robin|castagn/.test(cat)&&s!=="Robinia"&&ESOTICHE.has(s)&&v.n>v.nt)out.push({bad:1,t:`${s}: in area protetta le esotiche infestanti vanno contrastate a ogni taglio (art. 30).`});
  else if(ESOTICHE.has(s)&&v.n>v.nt)out.push({t:`${s} è esotica invasiva: valutare il taglio delle piante non segnate (art. 42 ter).`});}
 if(c.pctG>40)out.push({t:`Prelievo del ${fmt(c.pctG,0)}% dell'area basimetrica: diradamento forte, verificare la stabilità del popolamento.`});
 if(c.sup>0&&c.sup<500)out.push({t:"Area campione sotto i 500 m²: poco rappresentativa per un diradamento."});
 if(!a.punti||!a.punti.some(p=>p.tipo==="Centro area"))out.push({t:"Manca il punto del centro area: inseriscilo nella scheda Punti."});
 if(c.tipo&&c.tipo.bad)out.push({bad:1,t:c.tipo.t});
 const sA=c.snell.filter(x=>x.stato==="allievo"&&x.hd>100);
 if(sA.length)out.push({bad:1,t:`Allievi molto snelli (h/d oltre 100): piante n. ${sA.map(x=>x.i).join(", ")}. Rischio di schianto o di piegarsi dopo il diradamento: valuta un rilascio graduale o un altro allievo.`});
 const s8=c.snell.filter(x=>x.hd>80&&!(x.stato==="allievo"&&x.hd>100));
 if(s8.length)out.push({t:`${s8.length} piante rilasciate con h/d sopra 80: sono instabili, non isolarle troppo.`});
 if(c.fuori.length)out.push({bad:1,t:`Piante oltre il raggio dell'area (distanza dal centro > ${fmt(num(a.raggio),2)} m): n. ${c.fuori.join(", ")}. Vanno escluse.`});
 const sg=num(a.soglia);if(isCeduo(a.governo+" "+a.categoria)&&sg>SOGLIA_CEDUO)out.push({t:`Soglia di cavallettamento a ${fmt(sg)} cm in un ceduo: con 7,5 cm (dalla classe 10) non si escludono i polloni piccoli.`});
 if(c.cur&&c.cur.ko)out.push({t:c.cur.ko});

/* ---------- Persistenza db ---------- */
async function flush(id){if(!db||saving.has(id))return;saving.add(id);setSync();
 try{if(id.startsWith("c:")){const cid=id.slice(2);if(S.cantieri[cid])await db.collection("cantieri").doc(cid).set(JSON.parse(JSON.stringify(S.cantieri[cid])));else await db.collection("cantieri").doc(cid).delete();}
  else if(S.aree[id]){await db.collection("aree").doc(id).set(JSON.parse(JSON.stringify(S.aree[id])));}
  else{await db.collection("aree").doc(id).delete();}
  dirty.delete(id);online=true;}
 catch(e){if(e&&e.code==="quota_exceeded")toast("Spazio dati esaurito: elimina cantieri non più utili");else online=false;}
 finally{saving.delete(id);saveLocal();setSync();if(dirty.has(id)&&online)setTimeout(()=>flush(id),400);}}
const timers={};
function mark(id){dirty.add(id);saveLocal();setSync();clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700);}
function retryAll(){[...dirty].forEach(id=>flush(id));}
window.addEventListener("online",retryAll);
setInterval(()=>{if(db&&dirty.size&&!saving.size)retryAll();},20000);

async function initDb(){if(!window.claude||!claude.use){setSync();return;}
 claude.use("downloads").then(d=>{dl=d;render();});
 db=await claude.use("db");if(!db){setSync();return;}
 let timer=setTimeout(()=>{if(!online){$("#sync").textContent="Rete assente: dati sul telefono";}},10000);
 let primoC=true;
 db.collection("cantieri").onSnapshot(snap=>{if(snap.metadata.fromCache)return;
  if(primoC&&snap.empty){Object.keys(S.cantieri).forEach(cid=>dirty.add("c:"+cid));}
  else{const seen=new Set();for(const d of snap.docs){seen.add(d.id);if(!dirty.has("c:"+d.id))S.cantieri[d.id]=JSON.parse(JSON.stringify(d.data()));}
   for(const cid of Object.keys(S.cantieri))if(!seen.has(cid)&&!dirty.has("c:"+cid))delete S.cantieri[cid];}
  primoC=false;ensureAttivo();saveLocal();retryAll();render();},()=>{});
 let primoA=true;
 db.collection("aree").onSnapshot(snap=>{if(!snap.metadata.fromCache){online=true;clearTimeout(timer);}
  if(primoA&&!snap.metadata.fromCache&&snap.empty){Object.keys(S.aree).forEach(id=>dirty.add(id));}
  const seen=new Set();for(const d of snap.docs){seen.add(d.id);if(!dirty.has(d.id))S.aree[d.id]=JSON.parse(JSON.stringify(d.data()));}
  if(!snap.metadata.fromCache){primoA=false;for(const id of Object.keys(S.aree))if(!seen.has(id)&&!dirty.has(id))delete S.aree[id];}
  for(const [id,a] of Object.entries(S.aree))if(!a.cantiere){a.cantiere=S.attivo;dirty.add(id);}
  saveLocal();setSync();retryAll();render();},
  e=>{online=false;clearTimeout(timer);setSync();});
 setSync();}

   :`<button class="danger" data-act="askDelArea">Elimina area</button>`}</section>`;}

 const rows=Object.entries(c.sp).sort((x,y)=>y[1].g-x[1].g);
 return`<section class="panel"><h3>Prima e dopo il diradamento</h3>

  <tr><td>dg cm (diam. medio di G)</td><td class="n">${fmt(c.dgPre)}</td><td class="n">${fmt(c.dgT)}</td><td class="n">${fmt(c.dgPost)}</td><td class="n"></td></tr>
  <tr><td>Diametro medio aritm. cm</td><td class="n">${fmt(c.dmPre)}</td><td class="n">${fmt(c.dmT)}</td><td class="n">${fmt(c.dmPost)}</td><td class="n"></td></tr>
  <tr><td>Copertura %</td><td class="n">${a.copPrima||"–"}</td><td class="n"></td><td class="n">${a.copDopo||"–"}</td><td class="n"></td></tr>
  </tbody></table></div>
  ${c.tipo?`<div class="${c.tipo.bad?"note bad":"okline"}">${esc(c.tipo.t)}</div>`:""}
  ${c.Nt&&isFinite(c.pctN)?`<p class="muted" style="margin:0">Prelievo del ${fmt(c.pctN,0)}% delle piante e del ${fmt(c.pctG,0)}% dell'area basimetrica: ${c.pctN>c.pctG+3?"si tolgono più piante che area basimetrica, quindi piante sotto la media.":c.pctG>c.pctN+3?"si toglie più area basimetrica che piante, quindi piante sopra la media.":"piante di dimensione media."}</p>`:""}
  <p class="muted" style="margin:0">Volume = Σ g × h × f, con h ${c.cur&&!c.cur.ko?"dalla curva ipsometrica (o misurata)":isFinite(c.H)?`= ${fmt(c.H)} m (altezza media)`:"non disponibile: misura qualche altezza"} e coefficiente di forma f = ${fmt(c.f,2)}. Stima speditiva, non tavola di cubatura.</p></section>
  <section class="panel"><h3>Classi diametriche</h3>
  ${c.N?rClassi(c.cl,c.k,c.hD)+`<div class="${c.strut.k?"okline":"muted"}" style="${c.strut.k?"color:var(--ink);font-weight:500":""}">${esc(c.strut.t)}</div>`:`<p class="muted" style="margin:0">Nessuna pianta registrata.</p>`}</section>

/* Tabella e istogramma per classi: cl = conteggi per classe, k = fattore a ettaro, hD = altezza stimata per diametro (facolt.) */
function rClassi(cl,k,hD){const ks=Object.keys(cl).map(Number).sort((a,b)=>a-b);if(!ks.length)return"";
 const xs=[];for(let x=ks[0];x<=ks[ks.length-1];x+=5)xs.push(x);
 const z={taglio:0,resta:0,allievo:0,bio:0,g:0,gt:0,v:0,vt:0},o=x=>cl[x]||z,tot=x=>(o(x).taglio+o(x).resta+o(x).allievo+o(x).bio);
 const T={n:0,t:0,r:0,al:0,b:0,g:0,gt:0,v:0};
 const rows=xs.map(x=>{const q=o(x),n=tot(x);T.n+=n;T.t+=q.taglio;T.r+=q.resta;T.al+=q.allievo;T.b+=q.bio;T.g+=q.g;T.gt+=q.gt;T.v+=q.v;
  const h=hD?hD(x):NaN;
  return`<tr><td class="n">${x}</td><td class="n">${fmt(n*k,0)}</td><td class="n">${fmt(q.taglio*k,0)}</td><td class="n">${fmt(q.resta*k,0)}</td><td class="n">${fmt(q.allievo*k,0)}</td><td class="n">${fmt(q.bio*k,0)}</td><td class="n">${fmt(q.g*k,2)}</td><td class="n">${fmt(q.gt*k,2)}</td>${hD?`<td class="n">${fmt(h)}</td>`:""}<td class="n">${q.v>0?fmt(q.v*k,0):"–"}</td></tr>`;}).join("");
 return`<div class="chart">${istogramma(xs,o,k)}</div>
  <div class="muted"><span class="dot" style="background:var(--forest)"></span>resta (dopo) <span class="dot d-taglio" style="margin-left:10px"></span>taglio · la barra intera è il prima</div>
  <div class="scroll"><table><thead><tr><th class="n">Classe</th><th class="n">N/ha</th><th class="n">Taglio</th><th class="n">Non segn.</th><th class="n">Allievi</th><th class="n">Biod.</th><th class="n">G m²/ha</th><th class="n">G prel.</th>${hD?`<th class="n">h m</th>`:""}<th class="n">V m³/ha</th></tr></thead><tbody>${rows}
  <tr style="font-weight:600"><td>Totale</td><td class="n">${fmt(T.n*k,0)}</td><td class="n">${fmt(T.t*k,0)}</td><td class="n">${fmt(T.r*k,0)}</td><td class="n">${fmt(T.al*k,0)}</td><td class="n">${fmt(T.b*k,0)}</td><td class="n">${fmt(T.g*k,2)}</td><td class="n">${fmt(T.gt*k,2)}</td>${hD?"<td></td>":""}<td class="n">${T.v>0?fmt(T.v*k,0):"–"}</td></tr></tbody></table></div>
  <p class="muted" style="margin:0">Classi di 5 cm col valore centrale: 10 = 7,5–12,4 cm, 15 = 12,5–17,4 cm e così via. Valori a ettaro.</p>`;}
function istogramma(xs,o,k){const tot=x=>(o(x).taglio+o(x).resta+o(x).allievo+o(x).bio)*k;
 const mx=Math.max(1,...xs.map(tot)),bw=30,gap=8,H=140,top=20,L=4,W=L+xs.length*(bw+gap)+gap;
 let s=`<svg viewBox="0 0 ${W} ${top+H+24}" width="${Math.max(W,300)}" style="max-width:100%;height:auto;display:block" role="img" aria-label="Piante a ettaro per classe diametrica, prima e dopo il taglio">
  <text x="${L}" y="12" style="fill:var(--muted);font-size:10px">N/ha · massimo ${fmt(mx,0)}</text>`;
 xs.forEach((x,i)=>{const q=o(x),rt=(q.resta+q.allievo+q.bio)*k,tg=q.taglio*k,X=L+gap+i*(bw+gap),hR=rt/mx*H,hT=tg/mx*H;
  s+=`<rect x="${X}" y="${top+H-hR}" width="${bw}" height="${hR}" style="fill:var(--forest)"><title>Classe ${x}: restano ${fmt(rt,0)}/ha</title></rect>
  <rect x="${X}" y="${top+H-hR-hT}" width="${bw}" height="${hT}" style="fill:var(--paint)"><title>Classe ${x}: taglio ${fmt(tg,0)}/ha</title></rect>
  <text x="${X+bw/2}" y="${top+H+16}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${x}</text>`;});
 return s+`<line x1="${L}" y1="${top+H}" x2="${W}" y2="${top+H}" style="stroke:var(--muted);stroke-width:1"/></svg>`;}
function rAltezze(a,c){const PL=a.piante||[],mis=PL.filter(p=>+p.h>0);const ok=c.cur&&!c.cur.ko;
 let h=`<section class="panel"><h3>Altezze e curva ipsometrica</h3>`;
 if(ok){h+=`<div class="formula">h = ${fmt(c.cur.a,2)} ${c.cur.b>=0?"+":"−"} ${fmt(Math.abs(c.cur.b),2)} · ln(d) &nbsp; R² ${fmt(c.cur.r2,2)} · ${c.cur.n} altezze misurate</div>
  <div class="chart">${curvaSvg(PL,c)}</div>
  ${c.cur.n<10?`<p class="muted" style="margin:0">Con ${c.cur.n} altezze la curva è indicativa: meglio 10–15 piante su più classi.</p>`:""}
  ${c.cur.r2<0.3&&c.cur.n>=5?`<div class="note">R² basso: le altezze sono molto variabili rispetto al diametro. Controlla le misure.</div>`:""}`;}
 else h+=`<p class="muted" style="margin:0">${mis.length?`${mis.length} altezze misurate: `:""}${c.cur&&c.cur.ko?esc(c.cur.ko):"Misura l'altezza di almeno 3 piante, meglio 10–15 su classi diverse, per costruire la curva ipsometrica."} ${isFinite(c.H)?`Per ora il volume usa l'altezza media di ${fmt(c.H)} m.`:""}</p>`;
 h+=`<div class="kv"><div><b>${fmt(c.hDom)}</b><span>h dominante m</span></div><div><b>${c.nDom}</b><span>piante più grosse</span></div><div><b>${isFinite(c.H)?fmt(c.H):"–"}</b><span>h media m</span></div><div><b>${mis.length}</b><span>h misurate</span></div></div>
  <p class="muted" style="margin:0">Altezza dominante = media delle ${c.nDom} piante più grosse dell'area, cioè 100 a ettaro${isFinite(c.hDom)?(c.hDomMis?", tutte misurate":", in parte stimate dalla curva"):""}. Indica la fertilità della stazione.</p></section>`;
 return h;}
function curvaSvg(PL,c){const pts=PL.filter(p=>+p.h>0&&+p.d>0);const ds=PL.map(p=>+p.d).filter(d=>d>0);if(!pts.length||!ds.length)return"";
 const d0=Math.max(1,Math.min(...ds)),d1=Math.max(...ds),hMax=Math.max(...pts.map(p=>+p.h),c.hD(d1))*1.1;
 const W=320,H=170,L=30,B=22,T=8,R=8,X=d=>L+(d-d0)/Math.max(1,d1-d0)*(W-L-R),Y=h=>T+(1-h/hMax)*(H-T-B);
 let path="";for(let i=0;i<=30;i++){const d=d0+(d1-d0)*i/30;path+=(i?"L":"M")+X(d).toFixed(1)+" "+Y(c.hD(d)).toFixed(1);}
 return`<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto;display:block" role="img" aria-label="Curva ipsometrica: altezza in funzione del diametro">
  <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" style="stroke:var(--muted)"/><line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" style="stroke:var(--muted)"/>
  <text x="${L-4}" y="${Y(hMax/1.1)+4}" text-anchor="end" style="fill:var(--muted);font-size:10px">${fmt(hMax/1.1,0)}</text><text x="${L-4}" y="${H-B}" text-anchor="end" style="fill:var(--muted);font-size:10px">0</text>
  <text x="${L}" y="${H-6}" style="fill:var(--muted);font-size:10px">${fmt(d0,0)} cm</text><text x="${W-R}" y="${H-6}" text-anchor="end" style="fill:var(--muted);font-size:10px">${fmt(d1,0)} cm</text>
  <text x="${(L+W)/2}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font-size:10px">diametro → · ↑ h m</text>
  <path d="${path}" style="fill:none;stroke:var(--forest);stroke-width:2"/>
  ${pts.map(p=>`<circle cx="${X(+p.d).toFixed(1)}" cy="${Y(+p.h).toFixed(1)}" r="3.5" style="fill:var(--paint)"><title>${fmt(+p.d,0)} cm · ${fmt(+p.h)} m</title></circle>`).join("")}</svg>`;}
function rSnellezza(c){if(!c.snell.length)return"";const al=c.snell.filter(x=>x.stato==="allievo"),alti=c.snell.filter(x=>x.hd>80).sort((a,b)=>b.hd-a.hd);
 const m=arr=>arr.length?arr.reduce((s,x)=>s+x.hd,0)/arr.length:NaN;
 return`<section class="panel"><h3>Stabilità · rapporto di snellezza h/d</h3>
  <div class="kv"><div><b>${fmt(m(c.snell),0)}</b><span>h/d medio rilasci</span></div><div><b>${fmt(m(al),0)}</b><span>h/d medio allievi</span></div>
  <div><b>${c.snell.filter(x=>x.hd>80).length}</b><span>oltre 80</span></div><div><b>${c.snell.filter(x=>x.hd>100).length}</b><span>oltre 100</span></div></div>
  ${alti.length?`<div class="scroll"><table><thead><tr><th class="n">N.</th><th>Specie</th><th>Contrassegno</th><th class="n">d cm</th><th class="n">h m</th><th class="n">h/d</th></tr></thead><tbody>
   ${alti.slice(0,15).map(x=>`<tr><td class="n">${x.i}</td><td>${esc(x.specie)}</td><td>${STATI[x.stato]}</td><td class="n">${fmt(x.d,0)}</td><td class="n">${fmt(x.h)}${x.mis?"":"*"}</td><td class="n" style="${x.hd>100?"color:var(--bad);font-weight:600":""}">${fmt(x.hd,0)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="okline">Nessuna pianta rilasciata con h/d sopra 80.</div>`}
  <p class="muted" style="margin:0">Calcolato sulle piante che restano. h/d = altezza (m) / diametro (m): sotto 80 la pianta è stabile, sopra 100 è esile e rischia schianti o di piegarsi quando le vicine vengono tolte.${alti.some(x=>!x.mis)?" * altezza stimata dalla curva.":""}</p></section>`;}
function rGuida(){return`<section class="panel guida"><h2>Guida rapida al rilievo</h2>
  <h3>Diametro a 1,30 m</h3><ul><li>Si misura a 1,30 m da terra, dal lato a monte in pendenza.</li><li>Fusto biforcato sotto 1,30 m: due fusti. Nel ceduo ogni pollone è un fusto.</li><li>Nodo o deformazione a 1,30 m: misura appena sopra o sotto.</li><li>Fusti ovali: due letture incrociate, l'app fa la media.</li></ul>
  <h3>g · area basimetrica della pianta</h3><p>Superficie della sezione del fusto a 1,30 m.</p><div class="formula">g = π × d² / 4 &nbsp;(d in m) &nbsp;→&nbsp; g = π × (d/200)² con d in cm</div>
  <p>10 cm = 0,0079 m² · 20 cm = 0,0314 m² · 40 cm = 0,1257 m². Raddoppiando il diametro g quadruplica.</p>
  <h3>G · area basimetrica del bosco</h3><div class="formula">G = Σ g × 10.000 / superficie area (m²) &nbsp;→&nbsp; m²/ha</div>
  <p>Misura quanto il bosco è pieno, è legata al volume e si usa per dosare il diradamento come % di G prelevata. Robinieto adulto denso: circa 20–35 m²/ha.</p>
  <h3>Classi diametriche</h3><p>Intervalli di 5 cm col valore centrale: 10 = 7,5–12,4 cm, 15 = 12,5–17,4 cm. Velocizzano il rilievo, l'errore è trascurabile e mostrano la struttura:</p>
  <ul><li><strong>Campana</strong>: coetaneo o monoplano (ceduo, fustaia coetanea).</li><li><strong>J rovesciata</strong>: disetaneo, molte piante piccole e poche grandi.</li><li><strong>Bimodale</strong>: due strati o generazioni (ceduo con matricine).</li></ul>
  <h3>Soglia di cavallettamento</h3><p>Diametro minimo misurato: 17,5 cm in fustaia, 7,5 cm nel ceduo di robinia. Dichiarala e tienila uguale in tutte le aree.</p>
  <h3>dg · diametro medio di area basimetrica</h3><div class="formula">dg = √(4 × G / (π × N))</div>
  <p>Se dopo il taglio dg sale, il diradamento è dal basso (tolte piante piccole). Se scende, è dall'alto: da evitare se toglie le piante migliori.</p>
  <h3>Altezze, h dominante e volume</h3><p>Misura 10–15 altezze per area su classi diverse: l'app costruisce la curva h = a + b·ln(d) e stima l'altezza di ogni pianta. L'altezza dominante è la media delle 100 piante più grosse a ettaro (10 in 1.000 m²) e indica la fertilità.</p>
  <div class="formula">V = Σ g × h × f &nbsp;(f ≈ 0,45–0,50 per le latifoglie)</div>
  <h3>Snellezza h/d</h3><p>Altezza (m) / diametro (m). Sopra 80 la pianta è esile, sopra 100 rischia schianti o di piegarsi dopo il diradamento: attenzione nella scelta degli allievi.</p>
  <h3>Aree di saggio</h3><ul><li>Raggio 17,84 m = 1.000 m²; due aree su 2,1 ha ≈ 10%.</li><li>In punti tipici, né i migliori né sul margine.</li><li>Pianta di confine: dentro se il centro del fusto è entro il raggio. Un metro in più "a occhio" vale +11% di superficie.</li><li>Registra tutte le piante sopra soglia, anche quelle che restano.</li><li>Con due o più aree il Riepilogo calcola l'errore di campionamento di G.</li></ul></section>`;}

 if(!ids.length)return`<div class="panel empty"><strong>Nessun dato</strong>Il riepilogo si compila dalle aree campione.</div>`;

 const m=k=>{const v=cs.map(x=>x.c[k]).filter(isFinite);return v.length?v.reduce((s,x)=>s+x,0)/v.length:NaN;};
 const supTot=cs.reduce((s,x)=>s+x.c.sup,0),ha=+p.supHa||0;
 const Vt=m("Vtha")*ha,q=Vt*(+p.densita||0);
 const sp={};cs.forEach(x=>Object.entries(x.c.sp).forEach(([s,v])=>{sp[s]=(sp[s]||0)+v.gt*x.c.k/cs.length;}));
 const spr=Object.entries(sp).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const gtot=spr.reduce((s,x)=>s+x[1],0);

   const Ntot=cs.reduce((s,x)=>s+x.c.N,0);return Ntot?rClassi(agg,1,null)+`<div style="font-weight:500">${esc(struttura(agg,Ntot).t)}</div>`:`<p class="muted" style="margin:0">Nessuna pianta registrata.</p>`;})()}</section>

/* Errore di campionamento di G tra le aree (t di Student al 95%) */
const T95=[NaN,12.71,4.30,3.18,2.78,2.57,2.45,2.36,2.31,2.26,2.23];
function rVariabilita(cs){const n=cs.length;
 if(n<2)return`<section class="panel"><h3>Variabilità tra le aree</h3><p class="muted" style="margin:0">Con una sola area non si può stimare l'errore di campionamento: aggiungine almeno un'altra in un punto diverso del bosco.</p></section>`;
 const v=cs.map(x=>x.c.Gha),mu=v.reduce((s,x)=>s+x,0)/n,sd=Math.sqrt(v.reduce((s,x)=>s+(x-mu)**2,0)/(n-1)),cv=mu?sd/mu*100:NaN;
 const t=T95[n-1]||1.96,err=mu?t*sd/Math.sqrt(n)/mu*100:NaN;
 const nNec=isFinite(cv)&&cv>0?Math.ceil((1.96*cv/20)**2):NaN;
 return`<section class="panel"><h3>Variabilità tra le aree · G</h3>
  <div class="kv"><div><b>${fmt(mu)}</b><span>G media m²/ha</span></div><div><b>${fmt(sd)}</b><span>dev. standard</span></div><div><b>${fmt(cv,0)}%</b><span>coeff. variazione</span></div><div><b>±${fmt(err,0)}%</b><span>errore al 95%</span></div></div>
  ${err>20?`<div class="note">Errore di campionamento oltre il 20%: le aree sono molto diverse tra loro. ${isFinite(nNec)&&nNec>n?`Per scendere intorno al 20% servirebbero circa ${nNec} aree, oppure dividi il bosco in zone omogenee.`:"Valuta di dividere il bosco in zone omogenee."}</div>`:`<div class="okline">Errore entro il 20%: il campione è adeguato.</div>`}
  <p class="muted" style="margin:0">Errore = t × deviazione standard / √n, in % della media (t di Student al 95% con ${n-1} ${n===2?"grado":"gradi"} di libertà = ${fmt(t,2)}). Con due sole aree t è alto: l'errore è prudenziale.</p></section>`;}

let gpsWatch=null;
function gpsMedia(){const S0=(view.gpsS||[]);if(!S0.length)return null;const best=Math.min(...S0.map(x=>x.acc));
 const use=S0.filter(x=>x.acc<=Math.max(best*2,10));let w=0,la=0,lo=0,al=0,aw=0;
 for(const x of use){const k=1/Math.max(x.acc,1)**2;w+=k;la+=x.lat*k;lo+=x.lon*k;if(x.alt!=null){al+=x.alt*k;aw+=k;}}
 return{lat:la/w,lon:lo/w,alt:aw?al/aw:null,acc:best,n:use.length};}
function gpsStart(){if(!navigator.geolocation){view.gpsMsg="Questo browser non dà accesso al GPS.";render();return;}
 view.gpsS=[];view.gpsMsg="Ricerca della posizione… resta fermo sul punto.";
 try{gpsWatch=navigator.geolocation.watchPosition(p=>{const c=p.coords;view.gpsS.push({lat:c.latitude,lon:c.longitude,acc:c.accuracy,alt:c.altitude});
   if(view.gpsS.length>60)view.gpsS.shift();const m=gpsMedia();
   view.gpsMsg=`GPS attivo · ultima precisione ±${fmt(c.accuracy,0)} m${m.acc>15?" · sotto copertura attendi qualche lettura in più":""}`;render();},
  err=>{gpsStop(false);view.gpsMsg=err.code===1?(window.claude?"Dentro claude.ai il GPS è bloccato: apri il file dell'app nel browser del telefono, oppure inserisci le coordinate a mano.":"Permesso di posizione negato: consentilo al browser nelle impostazioni del telefono."):err.code===3?"Il GPS non risponde: spostati in un punto più aperto e riprova.":"Posizione non disponibile: verifica che la localizzazione del telefono sia attiva.";render();},
  {enableHighAccuracy:true,maximumAge:0,timeout:30000});}catch(e){gpsWatch=null;view.gpsMsg="Il GPS non è disponibile in questa vista.";}
 render();}
function gpsStop(r=true){if(gpsWatch!==null){try{navigator.geolocation.clearWatch(gpsWatch);}catch(e){}}gpsWatch=null;if(r)render();}
function gpsUsa(){const m=gpsMedia();if(!m)return;const u=UTM.toUTM(m.lat,m.lon);gpsStop(false);
 view.coordMode="utm";view.cE=u.E.toFixed(1);view.cN=u.N.toFixed(1);if(m.alt!=null)view.cQ=Math.round(m.alt);view.cAcc=Math.round(m.acc);
 view.gpsMsg=`Media di ${m.n} letture, precisione ±${fmt(m.acc,0)} m. Controlla e tocca Registra punto.`;render();}

 const soglia=num(a.soglia)||0;if(soglia&&dd<soglia){toast(`Sotto la soglia di ${fmt(soglia)} cm`);}
 const h=num($("#hIn").value),cep=String($("#cepIn").value||"").trim(),dist=num($("#distIn").value),nota=$("#nIn").value.trim();
 a.piante=a.piante||[];a.piante.push({id:uid(),specie:view.nuovaSp,d:dd,d1:d2?d:null,d2:d2||null,classe:!!dCl,h:h>0?h:null,stato:view.nuovoStato,note:nota,cep:cep||null,dist:dist>0?dist:null});
 view.nuovoD=Math.round(dd);view.nuovaCep=cep;view.nuovoH="";view.nuovaDist="";view.nuovaNota="";mark(view.id);render();
 const fuori=a.forma==="cerchio"&&dist>num(a.raggio);
 toast(fuori?`Attenzione: ${fmt(dist)} m è oltre il raggio di ${fmt(num(a.raggio),2)} m`:`Pianta ${a.piante.length}: ${view.nuovaSp} ${dCl?"classe "+dCl:fmt(dd,d2?1:0)+" cm"} · ${STATI[view.nuovoStato]}`);}
function addPunto(){const a=curArea();let E,N;
 if((view.coordMode||"utm")==="utm"){E=parseFloat(($("#cE").value||"").replace(",","."));N=parseFloat(($("#cN").value||"").replace(",","."));}
 else{const ll=UTM.parseLatLon($("#cLL").value);if(ll){const u=UTM.toUTM(ll.lat,ll.lon);E=u.E;N=u.N;}}
 if(!(isFinite(E)&&isFinite(N))){toast("Coordinate non valide");return;}
 if(!inPiemonte(E,N)){toast("Coordinate fuori dal Piemonte: controlla");return;}
 a.punti=a.punti||[];a.punti.push({id:uid(),tipo:$("#ptTipo").value,E:Math.round(E*10)/10,N:Math.round(N*10)/10,quota:$("#cQ").value.trim(),note:$("#cNote").value.trim(),acc:view.cAcc||null,ora:new Date().toISOString()});
 view.cAcc=null;view.gpsS=[];view.gpsMsg="";
 view.cE=view.cN=view.cLL=view.cQ=view.cNote="";view.ptTipo=$("#ptTipo").value==="Centro area"?"Albero biodiversità":$("#ptTipo").value;
 mark(view.id);render();toast("Punto registrato");}
function csv(rows){return rows.map(r=>r.map(v=>{const s=String(v??"");return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";")).join("\n");}
const slug=()=>(P().nome||"cantiere").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40)||"cantiere";
async function salvaFile(name,data,type){
 if(dl){try{await dl.save({filename:name,data});return true;}catch(e){if(e&&e.code!=="declined")toast("Salvataggio non riuscito");return false;}}
 try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;}catch(e){toast("Salvataggio non disponibile qui");return false;}}
async function backup(){const data=JSON.stringify({app:"contrassegnatura",versione:2,creato:new Date().toISOString(),cantieri:S.cantieri,aree:S.aree},null,1);
 if(await salvaFile(`backup_contrassegnatura_${oggi()}.json`,data,"application/json")){S.ultimoBackup=new Date().toISOString();saveLocal();render();toast("Backup salvato");}}
function ripristina(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let nc=0,na=0;
  if(o.cantieri){for(const [cid,c] of Object.entries(o.cantieri)){S.cantieri[cid]=c;dirty.add("c:"+cid);nc++;}for(const [id,a] of Object.entries(o.aree||{})){S.aree[id]=a;dirty.add(id);na++;}}
  else if(o.aree){const cid=migraVecchio(o);dirty.add("c:"+cid);nc=1;na=Object.keys(o.aree).length;Object.keys(o.aree).forEach(id=>dirty.add(id));}
  else throw 0;
  ensureAttivo();saveLocal();retryAll();view.name="archivio";render();toast(`Ripristinati ${nc} cantieri e ${na} aree`);}
 catch(e){toast("File di backup non valido");}};r.readAsText(file);}
async function esporta(kind){const n=v=>v==null||v===""?"":String(v).replace(".",",");let rows,name;
 if(kind==="piante"){rows=[["area","n","specie","diametro_cm","lettura1_cm","lettura2_cm","classe_cm","g_m2","altezza_misurata_m","altezza_stimata_m","h_d","contrassegno","ceppaia","distanza_centro_m","nota"]];
  areeDi(S.attivo).map(id=>S.aree[id]).forEach(a=>{const c=calc(a);(a.piante||[]).forEach((p,i)=>{const h=c.hOf(p),hd=isFinite(h)&&+p.d>0?h/(+p.d/100):NaN;
   rows.push([a.nome,i+1,p.specie,n(p.d),n(p.d1),n(p.d2),CL(p.d),n(gOf(p.d).toFixed(5)),n(p.h),isFinite(h)?n(h.toFixed(1)):"",isFinite(hd)?n(hd.toFixed(0)):"",STATI[p.stato],p.cep||"",n(p.dist),p.note]);});});name=slug()+"_piante.csv";}
 else{rows=[["area","punto","E_utm32n","N_utm32n","lat","lon","quota_m","nota","superficie_m2","categoria","governo","N_ha","G_ha","G_prel_ha","prelievo_G_pct","cop_prima","cop_dopo","dg_prima_cm","dg_dopo_cm","V_ha","V_prel_ha","h_dominante_m","tipo_diradamento","struttura"]];
  areeDi(S.attivo).map(id=>S.aree[id]).forEach(a=>{const c=calc(a);const base=[n(fmt(c.sup,0).replace(/\./g,"")),a.categoria,a.governo,n(c.Nha.toFixed(0)),n(c.Gha.toFixed(2)),n(c.Gtha.toFixed(2)),n(c.pctG.toFixed(1)),a.copPrima,a.copDopo,isFinite(c.dgPre)?n(c.dgPre.toFixed(1)):"",isFinite(c.dgPost)?n(c.dgPost.toFixed(1)):"",isFinite(c.Vha)?n(c.Vha.toFixed(0)):"",isFinite(c.Vtha)?n(c.Vtha.toFixed(0)):"",isFinite(c.hDom)?n(c.hDom.toFixed(1)):"",c.tipo?c.tipo.k:"",c.strut.k||""];
   const pts=a.punti&&a.punti.length?a.punti:[null];pts.forEach(pt=>{const ll=pt?UTM.fromUTM(pt.E,pt.N):null;
    rows.push([a.nome,pt?pt.tipo:"",pt?n(pt.E):"",pt?n(pt.N):"",ll?n(ll.lat.toFixed(6)):"",ll?n(ll.lon.toFixed(6)):"",pt?pt.quota:"",pt?pt.note:"",...base]);});});name=slug()+"_aree_punti.csv";}
 const data="\ufeff"+csv(rows);
 if(await salvaFile(name,data,"text/csv;charset=utf-8"))toast("File salvato");}

document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.go){gpsStop(false);view.name=d.go;view.confirm=null;render();window.scrollTo(0,0);return;}
 if(d.open){view={...view,name:"area",id:d.open,tab:"piante",confirm:null};render();window.scrollTo(0,0);return;}
 if(d.cant){S.attivo=d.cant;saveLocal();view={...view,name:"aree",id:null,confirm:null};render();window.scrollTo(0,0);toast("Cantiere aperto: "+(S.cantieri[d.cant].nome||""));return;}
 if(d.tab){if(d.tab!=="punti")gpsStop(false);view.tab=d.tab;view.confirm=null;render();return;}
 if(d.sp){view.nuovaSp=d.sp;render();return;}
 if(d.s){view.nuovoStato=d.s;render();return;}
 if(d.dd){const v=parseFloat(String($("#dIn").value).replace(",","."))||0;view.nuovoD=Math.max(5,Math.round(v+(+d.dd)));render();return;}
 if(d.cm){view.coordMode=d.cm;render();return;}
 if(d.md){view.modoD=d.md;render();return;}
 if(d.cl){addPianta(+d.cl);return;}
 if(d.askp){view.confirm="p"+d.askp;render();return;}
 if(d.delp){const a=curArea();a.piante=a.piante.filter(p=>p.id!==d.delp);view.confirm=null;mark(view.id);render();toast("Pianta eliminata");return;}
 if(d.askt){view.confirm="t"+d.askt;render();return;}
 if(d.delt){const a=curArea();a.punti=a.punti.filter(p=>p.id!==d.delt);view.confirm=null;mark(view.id);render();toast("Punto eliminato");return;}
 if(d.exp){esporta(d.exp);return;}
 const act=d.act;if(!act)return;
 if(act==="gpsStart"){gpsStart();return;}if(act==="gpsStop"){gpsStop();return;}if(act==="gpsUsa"){gpsUsa();return;}
 if(act==="cepNext"){const v=String(($("#cepIn")||{}).value||view.nuovaCep||"").trim(),n=parseInt(v,10);view.nuovaCep=isFinite(n)?String(n+1):(v?v+"1":"1");render();return;}
 if(act==="nuovaArea")nuovaArea();else if(act==="addPianta")addPianta();else if(act==="addPunto")addPunto();
 else if(act==="askDelArea"){view.confirm="area";render();}
 else if(act==="askDelCantiere"){view.confirm="cantiere";render();}
 else if(act==="delCantiere"){const cid=S.attivo;areeDi(cid).forEach(id=>{delete S.aree[id];mark(id);});delete S.cantieri[cid];mark("c:"+cid);S.attivo=null;ensureAttivo();saveLocal();view={...view,name:"archivio",confirm:null};render();toast("Cantiere eliminato");}
 else if(act==="nuovoCantiere"){const cid="c"+uid();S.cantieri[cid]=nuovoCantiere({nome:"Nuovo cantiere"});S.attivo=cid;mark("c:"+cid);view={...view,name:"progetto",confirm:null};render();window.scrollTo(0,0);toast("Cantiere creato: compila i dati");}
 else if(act==="backup"){backup();}
 else if(act==="noConfirm"){view.confirm=null;render();}
 else if(act==="delArea"){const id=view.id;delete S.aree[id];view={...view,name:"aree",id:null,confirm:null};mark(id);render();toast("Area eliminata");}});

document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.f){const a=curArea();if(!a)return;a[t.dataset.f]=t.value;mark(view.id);
  if(t.dataset.f==="governo"&&isCeduo(t.value)&&(!num(a.soglia)||num(a.soglia)===SOGLIA_FUSTAIA)){a.soglia=SOGLIA_CEDUO;toast("Soglia di cavallettamento portata a 7,5 cm per il ceduo");}
  if(t.dataset.f==="forma"||t.dataset.f==="raggio"||t.dataset.f==="superficie"){const el=$("#app .panel p.muted .mono");if(el)el.textContent=fmt(supArea(a),0)+" m²";}
  if(t.tagName==="SELECT")render();return;}
 if(t.dataset.pf){const p=P();p[t.dataset.pf]=t.value;mark("c:"+S.attivo);if(t.tagName==="SELECT"){render();return;}$("#hdrSub").textContent=p.nome||[p.comune,p.localita].filter(Boolean).join(" · ");return;}
 if(t.id==="spSel"){view.nuovaSp=t.value;render();return;}
 if(t.id==="dIn"){view.nuovoD=t.value;return;}
 if(t.id==="cepIn"){view.nuovaCep=t.value;return;}if(t.id==="hIn"){view.nuovoH=t.value;return;}if(t.id==="distIn"){view.nuovaDist=t.value;return;}if(t.id==="nIn"){view.nuovaNota=t.value;return;}
 if(["cE","cN","cLL","cQ","cNote"].includes(t.id)){view[t.id]=t.value;if(t.id==="cE"||t.id==="cN"||t.id==="cLL")view.cAcc=null;if(t.id!=="cQ"&&t.id!=="cNote"){clearTimeout(view._ct);view._ct=setTimeout(render,350);}return;}
 if(t.id==="ptTipo"){view.ptTipo=t.value;}});
document.addEventListener("change",e=>{if(e.target.id==="restoreIn"&&e.target.files&&e.target.files[0]){ripristina(e.target.files[0]);e.target.value="";}});
window.addEventListener("online",setSync);window.addEventListener("offline",setSync);
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&["dIn","d2In","hIn","nIn","cepIn","distIn"].includes(e.target.id)){e.preventDefault();if((view.modoD||"esatto")==="esatto")addPianta();}});

ensureAttivo();saveLocal();render();initDb();
try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{persistito=!!p;if(view.name==="archivio")render();}).catch(()=>{});}}catch(e){}

try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")&&document.querySelector('link[rel="manifest"]')){navigator.serviceWorker.register("sw.js").catch(()=>{});}}catch(e){}
